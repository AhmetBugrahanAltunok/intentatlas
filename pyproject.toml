[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "intentatlas"
dynamic = ["version"]
description = "The living intent map for software projects"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "IntentAtlas contributors" }]
keywords = ["architecture", "code-graph", "developer-tools", "git", "obsidian"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Documentation",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "packaging==26.2",
  "PyYAML>=6.0.2,<7",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.11,<1",
]
security = [
  "bandit>=1.8,<2",
  "pip-audit>=2.7,<3",
]
release = [
  "build==1.3.0",
  "hatchling==1.31.0",
  "packaging==26.2",
]
typing = [
  "mypy>=1.15,<2",
]

[project.scripts]
intentatlas = "intentatlas.cli:main"

[project.urls]
Homepage = "https://github.com/AhmetBugrahanAltunok/IntentAtlas"
Source = "https://github.com/AhmetBugrahanAltunok/IntentAtlas"
Documentation = "https://github.com/AhmetBugrahanAltunok/IntentAtlas/tree/main/docs"
Changelog = "https://github.com/AhmetBugrahanAltunok/IntentAtlas/blob/main/CHANGELOG.md"
Issues = "https://github.com/AhmetBugrahanAltunok/IntentAtlas/issues"

[tool.hatch.version]
path = "src/intentatlas/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/intentatlas"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/benchmarks/recommendation-corpus.json",
  "/benchmarks/corpus/*.json",
  "/tools/verify_release.py",
  "/docs",
  "/CHANGELOG.md",
  "/CODE_OF_CONDUCT.md",
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/README.md",
  "/README.tr.md",
  "/RELEASING.md",
  "/SECURITY.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --basetemp=.pytest_tmp"
cache_dir = ".pytest_cache"

[tool.coverage.run]
branch = true
source = ["intentatlas"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".intentatlas", ".pytest_tmp", ".venv", "atlas"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
files = ["src/intentatlas", "tools/verify_release.py"]
mypy_path = "src"
strict = true
warn_unreachable = true
show_error_codes = true
