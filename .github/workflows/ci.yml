name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m pytest --cov=intentatlas --cov-report=term-missing --cov-fail-under=80

  cross-platform-e2e:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Install the built wheel
        run: >-
          python -c "import glob, subprocess, sys; wheels = glob.glob('dist/*.whl');
          assert len(wheels) == 1; subprocess.check_call([sys.executable, '-m', 'pip',
          'install', '--force-reinstall', '--no-deps', wheels[0]])"
      - run: intentatlas --version
      - run: python -m pytest tests/test_e2e.py -q

  reproducible-package:
    runs-on: ubuntu-latest
    env:
      SOURCE_DATE_EPOCH: "1704067200"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[release]"
      - run: python -m build --sdist --wheel --outdir var/release-a
      - run: python -m build --sdist --wheel --outdir var/release-b
      - name: Verify artifacts and record provenance
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: >-
          python tools/verify_release.py var/release-a var/release-b
          --write-provenance var/release-provenance.json
          --source-revision "$SOURCE_REVISION"
          --source-date-epoch "$SOURCE_DATE_EPOCH"

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Render the large-graph viewer in Chrome
        env:
          INTENTATLAS_REQUIRE_BROWSER: "1"
        run: python -m pytest tests/test_browser_e2e.py -q

  static-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[typing]"
      - run: python -m mypy

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[security]"
      - run: python -m bandit -q -r src
      - run: python -m pip_audit
