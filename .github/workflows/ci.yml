name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m pytest --cov=intentatlas --cov-report=term-missing --cov-fail-under=80

  cross-platform-e2e:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Install the built wheel
        run: >-
          python -c "import glob, subprocess, sys; wheels = glob.glob('dist/*.whl');
          assert len(wheels) == 1; subprocess.check_call([sys.executable, '-m', 'pip',
          'install', '--force-reinstall', '--no-deps', wheels[0]])"
      - run: intentatlas --version
      - run: python -m pytest tests/test_e2e.py -q

  reproducible-package:
    runs-on: ubuntu-latest
    env:
      SOURCE_DATE_EPOCH: "1704067200"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev,release]"
      - run: python -m build --sdist --wheel --outdir var/release-a
      - run: python -m build --sdist --wheel --outdir var/release-b
      - name: Verify artifacts and record provenance
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: >-
          python tools/verify_release.py var/release-a var/release-b
          --write-provenance var/release-provenance.json
          --source-revision "$SOURCE_REVISION"
          --source-date-epoch "$SOURCE_DATE_EPOCH"
      - name: Rebuild, install, and test the verified source archive
        shell: bash
        run: |
          mkdir -p var/sdist-wheel var/sdist-source
          python -m pip wheel --no-deps --no-build-isolation var/release-a/*.tar.gz --wheel-dir var/sdist-wheel
          cmp var/release-a/*.whl var/sdist-wheel/*.whl
          python -m venv var/sdist-install
          var/sdist-install/bin/python -m pip install --no-deps var/sdist-wheel/*.whl
          expected_version="$(python -c 'import intentatlas; print(f"IntentAtlas {intentatlas.__version__}")')"
          test "$(var/sdist-install/bin/intentatlas --version)" = "$expected_version"
          var/sdist-install/bin/intentatlas demo --report json |
            var/sdist-install/bin/python -c 'import json, sys; report = json.load(sys.stdin); assert report["schema_version"] == 1'
          tar -xzf var/release-a/*.tar.gz -C var/sdist-source
          mapfile -t roots < <(find var/sdist-source -mindepth 1 -maxdepth 1 -type d -print)
          test "${#roots[@]}" -eq 1
          (cd "${roots[0]}" && PYTHONPATH="$PWD/src" python -m pytest -q)

  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Render the large-graph viewer in Chrome
        env:
          INTENTATLAS_REQUIRE_BROWSER: "1"
        run: python -m pytest tests/test_browser_e2e.py -q

  static-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[typing]"
      - run: python -m mypy

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev,release,security,typing]"
      - run: python -m bandit -q -r src tools
      - run: python -m pip_audit --skip-editable
