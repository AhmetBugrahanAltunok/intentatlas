<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
  <title id="title">IntentAtlas</title>
  <desc id="desc">A connected atlas of intent nodes</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151128"/>
      <stop offset="1" stop-color="#080b16"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="4" y="4" width="152" height="152" rx="40" fill="url(#bg)" stroke="#312e52" stroke-width="2"/>
  <g fill="none" stroke="url(#line)" stroke-width="3" stroke-linecap="round" opacity=".9">
    <path d="M40 43 80 79 122 39M80 79 122 115M80 79 39 121"/>
    <path d="M40 43 39 121M122 39 122 115" opacity=".35"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="80" cy="79" r="15" fill="#8b5cf6" stroke="#ddd6fe" stroke-width="3"/>
    <circle cx="40" cy="43" r="9" fill="#f59e0b" stroke="#fde68a" stroke-width="2"/>
    <circle cx="122" cy="39" r="9" fill="#22d3ee" stroke="#cffafe" stroke-width="2"/>
    <circle cx="122" cy="115" r="9" fill="#34d399" stroke="#d1fae5" stroke-width="2"/>
    <circle cx="39" cy="121" r="9" fill="#fb7185" stroke="#ffe4e6" stroke-width="2"/>
  </g>
</svg>
